[project]
name = "waen"
version = "0.1.0"
description = "Real-time on-screen game text translator (EN to TH) with overlay"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "numpy>=1.26",
    "mss>=9.0",
    "bettercam>=1.0; sys_platform == 'win32'",
    "deep-translator>=1.11",
    "rapidfuzz>=3.0",
    "rapidocr-onnxruntime>=1.3,<2",
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.gui-scripts]
waen = "waen.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["waen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
